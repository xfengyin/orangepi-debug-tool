name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Test Suite
    # Tauri 的 cargo clippy/编译峰值内存 1-2G，OrangePi Zero3 只有 1.4G RAM + 735M zram，扛不住；
    # 重活固定到 NAS 的 amd64 runner。轻量 job（lint/单测）仍可落在 ubuntu-latest（两台都有）。
    runs-on: amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust
        run: |
          # rustup 安装带重试,抵御代理节点波动(sh.rustup.rs SSL_ERROR_SYSCALL)
          ok=0
          for i in 1 2 3 4 5; do
            if curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | \
               sh -s -- -y --default-toolchain stable --profile minimal \
               --component rustfmt --component clippy; then
              ok=1; break
            fi
            echo "::warning::rustup 安装第 $i 次失败,5 秒后重试"
            rm -rf "$HOME/.cargo" "$HOME/.rustup"
            sleep 5
          done
          [ "$ok" = 1 ] || { echo "::error::rustup 安装 5 次均失败"; exit 1; }
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          source "$HOME/.cargo/env"
          rustc --version && cargo --version

      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            ~/.cargo
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('package-lock.json', 'src-tauri/Cargo.lock') }}

      # clippy 需要编译 Tauri 依赖，必须先装齐系统库（否则 gobject-2.0 找不到）
      - name: Install Linux dependencies
        run: |
          sudo apt-get update || true
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: TypeScript type checking
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Unit tests (vitest)
        run: npm test

      - name: Rust formatting check
        run: cd src-tauri && cargo fmt --check

      - name: Rust clippy lints
        # 注：missing_docs 已在 src/lib.rs 中声明为 allow（历史文档缺口 ~800 处），
        # 因此这里保持严格 `-D warnings`，任何真实 clippy/rustc 警告都会阻塞。
        run: cd src-tauri && cargo clippy -- -D warnings

  build:
    name: Build Check
    needs: test
    # Gitea 上没有 windows/macos runner：这些组合只在 GitHub 上跑（Gitea 侧 job 级 if 需配合 needs 才生效）
    if: github.server_url == 'https://github.com' || matrix.github_only == false
    runs-on: ${{ github.server_url == 'https://github.com' && matrix.os || matrix.gitea_os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            gitea_os: amd64
            github_only: false
          - os: windows-latest
            gitea_os: amd64
            github_only: true
          - os: macos-latest
            gitea_os: amd64
            github_only: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust
        run: |
          # rustup 安装带重试,抵御代理节点波动(sh.rustup.rs SSL_ERROR_SYSCALL)
          ok=0
          for i in 1 2 3 4 5; do
            if curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | \
               sh -s -- -y --default-toolchain stable --profile minimal; then
              ok=1; break
            fi
            echo "::warning::rustup 安装第 $i 次失败,5 秒后重试"
            rm -rf "$HOME/.cargo" "$HOME/.rustup"
            sleep 5
          done
          [ "$ok" = 1 ] || { echo "::error::rustup 安装 5 次均失败"; exit 1; }
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          source "$HOME/.cargo/env"
          rustc --version && cargo --version

      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            ~/.cargo
            src-tauri/target
          key: ${{ runner.os }}-${{ matrix.os }}-build-${{ hashFiles('package-lock.json', 'src-tauri/Cargo.lock') }}

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update || true
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        run: npm run tauri:build

      - name: Upload build artifacts (Gitea)
        if: github.server_url != 'https://github.com'
        uses: actions/upload-artifact@v3
        with:
          name: build-artifacts-${{ matrix.os }}
          path: src-tauri/target/release/bundle
          retention-days: 7

      - name: Upload build artifacts (GitHub)
        if: github.server_url == 'https://github.com'
        uses: actions/upload-artifact@v6
        with:
          name: build-artifacts-${{ matrix.os }}
          path: src-tauri/target/release/bundle
          retention-days: 7
