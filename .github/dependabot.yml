version: 2
updates:
  # 前端依赖
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "chore"
      include: "scope"
    # 跨大版本迁移需协同升级 + 代码迁移（Grid API / eslint flat config / tsgo），
    # 单独 bump 一个包只会 peer 冲突或破坏构建，留待专门立项处理。
    ignore:
      - dependency-name: "typescript"
        versions: [">=6.0.0"]
      - dependency-name: "@mui/material"
        versions: [">=6.0.0"]
      - dependency-name: "@mui/icons-material"
        versions: [">=6.0.0"]
      - dependency-name: "eslint"
        versions: [">=9.0.0"]
      - dependency-name: "@typescript-eslint/parser"
        versions: [">=8.0.0"]
      - dependency-name: "@typescript-eslint/eslint-plugin"
        versions: [">=8.0.0"]
      - dependency-name: "react-router-dom"
        versions: [">=7.0.0"]
      - dependency-name: "eslint-plugin-react-hooks"
        versions: [">=5.0.0"]

  # Rust 依赖
  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "rust"
    commit-message:
      prefix: "chore"
      include: "scope"
    # sqlx 0.8+ / reqwest 0.13+ 是破坏性 API 变更，留待专门立项。
    ignore:
      - dependency-name: "sqlx"
        versions: [">=0.8.0"]
      - dependency-name: "reqwest"
        versions: [">=0.13.0"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
      include: "scope"
