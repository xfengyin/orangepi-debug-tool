[package]
name = "orangepi-debug-tool"
version = "0.1.0"
edition = "2021"

[lib]
name = "orangepi_debug_tool_lib"
crate-type = ["lib"]

[dependencies]
tokio = { version = "1", features = ["full"] }
thiserror = "1"
tracing = "0.1"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
serialport = "4"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio-test = "0.4"
